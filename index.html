<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Market Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">
  <span id="hud-cash" class="cash">$500</span>
  <span id="hud-rep">⭐ 0</span>
  <span id="hud-wanted" title="Wanted level">☆☆☆☆☆</span>
  <span class="heatwrap" title="Heat"><span id="hud-heat"></span></span>
  <span id="hud-day">☀️ Day 1</span>
  <span id="hud-carry">🎒 0/8</span>
  <span id="hud-vehicle">👟 On Foot</span>
  <span id="hud-smoke">💨 ×1</span>
  <span id="hud-district" class="district">The Slums</span>
  <span class="hint">E interact • P prices • M missions • Q smoke • H help • <b id="hud-version">v2.0</b></span>
</div>

<div id="event-banner"></div>
<div id="mission-hud"></div>
<div id="toasts"></div>
<div id="panel"></div>
<div id="log" title="Activity log"></div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/economy.js"></script>
<script src="js/police.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
